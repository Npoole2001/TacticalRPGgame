plugins {
    id 'java'
    id 'application'
}

group = 'sh.vibecraft'
version = '0.1.0-SNAPSHOT'

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

// LWJGL version and natives
project.ext.lwjglVersion = "3.3.3"
project.ext.jomlVersion = "1.10.5"

// Detect OS for native libraries
switch (org.gradle.internal.os.OperatingSystem.current()) {
    case org.gradle.internal.os.OperatingSystem.LINUX:
        project.ext.lwjglNatives = "natives-linux"
        break
    case org.gradle.internal.os.OperatingSystem.MAC_OS:
        project.ext.lwjglNatives = System.getProperty("os.arch") == "aarch64" ? "natives-macos-arm64" : "natives-macos"
        break
    case org.gradle.internal.os.OperatingSystem.WINDOWS:
        project.ext.lwjglNatives = System.getProperty("os.arch").contains("64") ? "natives-windows" : "natives-windows-x86"
        break
}

dependencies {
    // Use local jars from libs/ directory
    implementation files('libs/lwjgl-3.3.3.jar')
    implementation files('libs/lwjgl-glfw-3.3.3.jar')
    implementation files('libs/lwjgl-opengl-3.3.3.jar')
    implementation files('libs/lwjgl-stb-3.3.3.jar')
    implementation files('libs/lwjgl-nanovg-3.3.3.jar')

    // LWJGL natives
    runtimeOnly files("libs/lwjgl-3.3.3-${lwjglNatives}.jar")
    runtimeOnly files("libs/lwjgl-glfw-3.3.3-${lwjglNatives}.jar")
    runtimeOnly files("libs/lwjgl-opengl-3.3.3-${lwjglNatives}.jar")
    runtimeOnly files("libs/lwjgl-stb-3.3.3-${lwjglNatives}.jar")
    runtimeOnly files("libs/lwjgl-nanovg-3.3.3-${lwjglNatives}.jar")

    // JOML for math (vectors, matrices)
    implementation files('libs/joml-1.10.5.jar')

    // Gson for JSON serialization
    implementation files('libs/gson-2.10.1.jar')

    // Testing
    testImplementation files('libs/junit-jupiter-api-5.10.1.jar')
    testImplementation files('libs/junit-jupiter-engine-5.10.1.jar')
    testImplementation files('libs/junit-platform-commons-1.10.1.jar')
    testImplementation files('libs/opentest4j-1.3.0.jar')
}

application {
    mainClass = 'sh.vibecraft.hexcontrol.HexControlApp'
}

jar {
    manifest {
        attributes 'Main-Class': 'sh.vibecraft.hexcontrol.HexControlApp'
    }
}

run {
    // -XstartOnFirstThread is required for macOS only
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs = ['-XstartOnFirstThread']
    }
}

test {
    useJUnitPlatform()
}
