plugins {
    id 'java'
    id 'application'
}

group = 'sh.vibecraft'
version = '0.1.0-SNAPSHOT'

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
}

// LWJGL version and natives
project.ext.lwjglVersion = "3.3.3"
project.ext.jomlVersion = "1.10.5"

// Detect OS for native libraries
switch (org.gradle.internal.os.OperatingSystem.current()) {
    case org.gradle.internal.os.OperatingSystem.LINUX:
        project.ext.lwjglNatives = "natives-linux"
        break
    case org.gradle.internal.os.OperatingSystem.MAC_OS:
        project.ext.lwjglNatives = System.getProperty("os.arch") == "aarch64" ? "natives-macos-arm64" : "natives-macos"
        break
    case org.gradle.internal.os.OperatingSystem.WINDOWS:
        project.ext.lwjglNatives = System.getProperty("os.arch").contains("64") ? "natives-windows" : "natives-windows-x86"
        break
}

dependencies {
    // LWJGL BOM
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    // LWJGL core
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl-nanovg"

    // LWJGL natives
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nanovg::$lwjglNatives"

    // JOML for math (vectors, matrices)
    implementation "org.joml:joml:$jomlVersion"

    // Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'sh.vibecraft.hexcontrol.HexControlApp'
}

jar {
    manifest {
        attributes 'Main-Class': 'sh.vibecraft.hexcontrol.HexControlApp'
    }
}

run {
    jvmArgs = ['-XstartOnFirstThread'] // Required for macOS
}
